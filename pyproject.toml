[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supestar-kac-agent"
version = "0.1.0"
description = "Local Qwen agent that explores CCS knowledge and executes KAC skills"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
supestar-agent = "supestar_kac_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
